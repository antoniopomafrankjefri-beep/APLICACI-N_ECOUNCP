<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Main gradient for the circular background - Dark UNCP Green -->
    <linearGradient id="ecoCircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#204020"/>
      <stop offset="50%" stop-color="#1a351a"/>
      <stop offset="100%" stop-color="#0d1f0d"/>
    </linearGradient>
    
    <!-- Gold gradient for arrows and accents -->
    <linearGradient id="ecoGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0C000"/>
      <stop offset="50%" stop-color="#C08020"/>
      <stop offset="100%" stop-color="#A06010"/>
    </linearGradient>
    
    <!-- Leaf/plant gradient -->
    <linearGradient id="ecoLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#204020"/>
      <stop offset="50%" stop-color="#406020"/>
      <stop offset="100%" stop-color="#608030"/>
    </linearGradient>
    
    <!-- Subtle glow effect -->
    <filter id="ecoGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer ring - UNCP Verde oscuro -->
  <circle cx="50" cy="50" r="48" fill="url(#ecoCircleGrad)" stroke="#204020" stroke-width="3"/>
  
  <!-- Three recycling arrows forming a circle - simplified for small sizes -->
  <g filter="url(#ecoGlow)" transform="translate(50, 50) scale(0.45)">
    <!-- Arrow 1 - Top -->
    <path d="M0 -45 
             L-15 -35 
             L-5 -35 
             L-5 -5 
             L5 -5 
             L5 -35 
             L15 -35 
             Z" 
          fill="url(#ecoGoldGrad)" 
          transform="rotate(-30)"/>
    
    <!-- Arrow 2 - Bottom right -->
    <path d="M0 -45 
             L-15 -35 
             L-5 -35 
             L-5 -5 
             L5 -5 
             L5 -35 
             L15 -35 
             Z" 
          fill="url(#ecoGoldGrad)" 
          transform="rotate(90)"/>
    
    <!-- Arrow 3 - Bottom left -->
    <path d="M0 -45 
             L-15 -35 
             L-5 -35 
             L-5 -5 
             L5 -5 
             L5 -35 
             L15 -35 
             Z" 
          fill="url(#ecoGoldGrad)" 
          transform="rotate(210)"/>
  </g>
  
  <!-- Central plant element -->
  <g transform="translate(50, 50) scale(0.4)">
    <!-- Leaf stem -->
    <path d="M0 15 Q0 -5 -8 -12 Q0 -3 0 5 Q0 -5 8 -12 Q0 -5 0 15 Z" 
          fill="url(#ecoLeafGrad)" 
          opacity="0.9"/>
    
    <!-- Small leaf on left -->
    <path d="M-6 3 Q-15 -3 -8 -10 Q-6 -7 -6 3 Z" 
          fill="#406020" 
          opacity="0.8"/>
    
    <!-- Small leaf on right -->
    <path d="M6 3 Q15 -3 8 -10 Q6 -7 6 3 Z" 
          fill="#406020" 
          opacity="0.8"/>
    
    <!-- Central dot - golden -->
    <circle cx="0" cy="8" r="3" fill="url(#ecoGoldGrad)"/>
  </g>
</svg>
