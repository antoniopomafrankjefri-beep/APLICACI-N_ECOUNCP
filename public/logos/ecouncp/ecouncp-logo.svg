<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Main gradient for the circular background - Dark UNCP Green -->
    <linearGradient id="ecoCircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#204020"/>
      <stop offset="50%" stop-color="#1a351a"/>
      <stop offset="100%" stop-color="#0d1f0d"/>
    </linearGradient>
    
    <!-- Gold gradient for arrows and accents -->
    <linearGradient id="ecoGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0C000"/>
      <stop offset="50%" stop-color="#C08020"/>
      <stop offset="100%" stop-color="#A06010"/>
    </linearGradient>
    
    <!-- Leaf/plant gradient -->
    <linearGradient id="ecoLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#204020"/>
      <stop offset="50%" stop-color="#406020"/>
      <stop offset="100%" stop-color="#608030"/>
    </linearGradient>
    
    <!-- Subtle glow effect -->
    <filter id="ecoGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Inner shadow for depth -->
    <filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feOffset dx="2" dy="2"/>
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer ring - UNCP Verde oscuro -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="#204020" stroke-width="16"/>
  
  <!-- Main circular background with gradient -->
  <circle cx="256" cy="256" r="240" fill="url(#ecoCircleGrad)"/>
  
  <!-- Subtle inner ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#305030" stroke-width="2" opacity="0.6"/>
  
  <!-- Three recycling arrows forming a circle -->
  <g filter="url(#ecoGlow)">
    <!-- Arrow 1 - Top (pointing right/down) -->
    <path d="M256 60 
             L236 80 
             L246 80 
             L246 140 
             L266 140 
             L266 80 
             L276 80 
             Z" 
          fill="url(#ecoGoldGrad)" 
          transform="rotate(-30 256 256)"/>
    
    <!-- Arrow 2 - Bottom right (pointing left/down) -->
    <path d="M256 60 
             L236 80 
             L246 80 
             L246 140 
             L266 140 
             L266 80 
             L276 80 
             Z" 
          fill="url(#ecoGoldGrad)" 
          transform="rotate(90 256 256)"/>
    
    <!-- Arrow 3 - Bottom left (pointing up/right) -->
    <path d="M256 60 
             L236 80 
             L246 80 
             L246 140 
             L266 140 
             L266 80 
             L276 80 
             Z" 
          fill="url(#ecoGoldGrad)" 
          transform="rotate(210 256 256)"/>
  </g>
  
  <!-- Central plant/leaf element -->
  <g transform="translate(256, 256)">
    <!-- Leaf stem -->
    <path d="M0 20 Q0 0 -15 -20 Q0 -10 0 10 Q0 0 15 -20 Q0 0 0 20 Z" 
          fill="url(#ecoLeafGrad)" 
          opacity="0.9"/>
    
    <!-- Small leaf on left -->
    <path d="M-10 5 Q-25 -5 -15 -15 Q-10 -10 -10 5 Z" 
          fill="#406020" 
          opacity="0.8"/>
    
    <!-- Small leaf on right -->
    <path d="M10 5 Q25 -5 15 -15 Q10 -10 10 5 Z" 
          fill="#406020" 
          opacity="0.8"/>
    
    <!-- Central dot - golden -->
    <circle cx="0" cy="15" r="6" fill="url(#ecoGoldGrad)"/>
  </g>
  
  <!-- University ring text indicator (subtle) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#E0C000" stroke-width="1" opacity="0.15" stroke-dasharray="8 12"/>
  
  <!-- Small accent dots around the circle -->
  <g fill="#E0C000" opacity="0.4">
    <circle cx="256" cy="60" r="3"/>
    <circle cx="256" cy="452" r="3"/>
    <circle cx="60" cy="256" r="3"/>
    <circle cx="452" cy="256" r="3"/>
  </g>
</svg>
